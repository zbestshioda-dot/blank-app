# fly.toml for the live game app (newlifetownth)
# See https://docs.fly.io/reference/configuration

app = 'newlifetownth'
primary_region = 'sin'

[build]

# Player saves live on a persistent volume so a deploy never wipes them.
# Create it once first:  fly volumes create lifetown_data --region sin --size 1
[env]
  DATA_DIR = '/data'

[mounts]
  source = 'lifetown_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
