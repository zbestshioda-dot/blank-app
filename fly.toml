# fly.toml for the live game app (newlifetownth)
# See https://docs.fly.io/reference/configuration

app = 'newlifetownth'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
