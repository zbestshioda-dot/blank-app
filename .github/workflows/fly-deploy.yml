# Deploys the game to fly.io on every push to this branch.
# First run only: backs up the live players.json, creates the persistent volume, and deploys with the
# backup as seed/players.json so the fresh volume starts with every player's save (see server/store.js).
# Needs the repo secret FLY_API_TOKEN (fly.io → app → Tokens → New Token). Without it the job is skipped.
name: Deploy to fly.io
on:
  push:
    branches: [claude/career-choice-multiplayer-game-jk4pzj]
  workflow_dispatch:
concurrency: fly-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check token
        id: tok
        run: if [ -n "$FLY_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::FLY_API_TOKEN secret not set - skipping deploy"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.tok.outputs.ok
      - name: First time - back up players and create the volume
        if: steps.tok.outputs.ok
        run: |
          set -e
          if flyctl volumes list --json | grep -q '"lifetown_data"'; then echo "volume exists - normal deploy"; exit 0; fi
          if flyctl secrets list | grep -q DATABASE_URL; then
            echo "players are in Postgres - no file to back up"
          else
            mkdir -p seed
            flyctl ssh sftp get /app/data/players.json seed/players.json
            test -s seed/players.json || { echo "backup is empty - stopping so nothing is lost"; exit 1; }
            ls -l seed/players.json
          fi
          flyctl scale count 1 --yes
          flyctl volumes create lifetown_data --region sin --size 1 --yes
      - name: Deploy
        if: steps.tok.outputs.ok
        run: flyctl deploy --remote-only --yes
